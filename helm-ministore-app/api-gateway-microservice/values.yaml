# Default values for api-gateway-microservice to be passed into your templates.

replicaCount: 1
name: api-gateway
    
spec:
  container:
    name: apigateway-frontend
    image: adehorizon/api-gateway:3.1
    port: 8080

resources:
  limits:
    memory: "128Mi"
    cpu: "500m"
  requests:
    memory: "64Mi"
    cpu: "250m"  

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20 

ConfigMap:
  metadata:
    name: api-gateway-config
  data:
    PRODUCT_SERVICE_URL: "http://product-service:3001"
    ORDER_SERVICE_URL: "http://order-service:3002"
    NOTIFICATION_SERVICE_URL: "http://notification-service:3003"

HorizontalPodAutoscaler:
  metadata:
    name: api-gateway-hpa
  spec:
    scaleTargetRef:
      name: api-gateway-deployment
    minReplicas: 3
    maxReplicas: 10
    metrics:
      resource:
        target:
          averageUtilization: 70

service:
  metadata:
    name: api-gateway-service
  spec:
    selector:
      app: api-gateway
    ports:
    - port: 80
      targetPort: 8080
    - port: 443
      targetPort: 8080