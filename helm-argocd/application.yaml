apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: helm-demo, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_GITHUB_OWNER/Gitops-argocd.git
    targetRevision: main
    path: helm-argocd/chart
    helm:
      valueFiles: [values.yaml]
  destination: {server: "https://kubernetes.default.svc", namespace: helm-demo}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
