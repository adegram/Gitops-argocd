replicaCount: 4
image: {repository: nginx/nginx:stable-alpine, tag: 3.24, digest: "", pullPolicy: IfNotPresent}

service: {port: 8080}
serviceAccount: {create: true, name: "", automountServiceAccountToken: false}
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  cpuUtilization: 65
  memoryUtilization: 75
podDisruptionBudget: {enabled: true, minAvailable: 2}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
