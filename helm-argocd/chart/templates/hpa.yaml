{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gitops-web}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gitops-web}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.cpuUtilization }}}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.memoryUtilization }}}}
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}}
{{- end }}
