apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: gitops-web-quota, namespace: {{ .Release.Namespace }}}
spec:
  hard: {pods: "40", requests.cpu: "8", requests.memory: 8Gi, limits.cpu: "16", limits.memory: 16Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gitops-web-default-deny, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gitops-web-traffic, namespace: {{ .Release.Namespace }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: gitops-web}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports: [{protocol: TCP, port: 8080}]
